<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inadimplência 8-2 | Dashboard + Gamificação</title>
    <meta name="description" content="Dashboard e Gamificação de Inadimplência 8-2 com gráficos responsivos, filtros por período e equipe, e exportação em PDF." />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="logo.png" />
    <meta property="og:title" content="Inadimplência 8-2 | Dashboard + Gamificação" />
    <meta property="og:description" content="Visualize evolução da inadimplência, impacto por vencimento e ranking com design profissional." />
    <meta property="og:image" content="logo.png" />
    <meta property="og:type" content="website" />

    <!-- Fontes e ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

    <!-- Chart.js e plugins -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/chartjs-plugin-gradient@0.6.1/dist/chartjs-plugin-gradient.min.js"></script>

    <!-- GSAP e Tilt (efeitos visuais) -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

    <!-- Estilos unificados -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Efeitos especiais: parabéns e alerta (fora do container principal) -->
    <div id="specialCongrats" style="display:none;position:fixed;z-index:9999;top:0;left:0;width:100vw;height:100vh;align-items:center;justify-content:center;pointer-events:none;"></div>
    <div id="specialAlert" style="display:none;position:fixed;z-index:9999;top:0;left:0;width:100vw;height:100vh;align-items:center;justify-content:center;pointer-events:none;"></div>

    <div class="container">
      <div class="header" style="margin-bottom: 16px;">
        <div class="header-content" style="justify-content: space-between; align-items: center;">
          <div class="header-logo">
            <img src="logo.png" alt="Logo da empresa" class="company-logo" width="80" height="80" />
          </div>
          <div class="header-text" style="flex:1;">
            <h1 style="
              font-size: 2.2rem; font-weight: 900; margin: 0;
              background: linear-gradient(135deg, #4ade80, #22d3ee, #a78bfa, #fb7185);
              -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            ">
              Inadimplência 8-2
            </h1>
            <p style="margin: 6px 0 0 0; color: #cbd5e1; font-weight: 600;">Dashboard Inadimplencia 8-2</p>
          </div>
        </div>
      </div>

      <nav class="tabs" style="margin-top: -4px;">
        <button id="tabDashboard" class="tab-btn active"><i class="fas fa-chart-line"></i> Dashboard</button>
        <button id="tabGamificacao" class="tab-btn"><i class="fas fa-trophy"></i> Gamificação</button>
        <button id="tabAdmin" class="tab-btn"><i class="fas fa-cog"></i> Admin</button>
      </nav>

      <!-- Área de conteúdo dinâmico -->
      <div id="app"></div>
    </div>

  <!-- Script para carregar API Client -->
  <script type="module" src="frontend/api-loader.js?v=3"></script>
  
  <!-- Configurações -->
  <script src="config.js?v=4"></script>
  
  <!-- Scripts principais -->
  <script defer src="script.js?v=11"></script>
  <script defer src="frontend/gamification.js?v=11"></script>
  
  <!-- Force no-cache para esses scripts -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  </body>
</html>
