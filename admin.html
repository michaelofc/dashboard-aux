<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel de Administrador - Metas</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #1f2937;
    }

    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
    }

    .login-box h1 {
      margin-bottom: 30px;
      text-align: center;
      color: #333;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #333;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #5568d3;
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .error {
      color: #dc2626;
      margin-top: 10px;
      font-size: 14px;
    }

    .admin-container {
      display: none;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .admin-container.active {
      display: block;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .admin-header h1 {
      color: #333;
    }

    .btn-logout {
      background: #dc2626;
      padding: 10px 20px;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-logout:hover {
      background: #b91c1c;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      background: white;
      padding: 10px;
      border-radius: 12px;
    }

    .tab-btn {
      padding: 10px 20px;
      border: none;
      background: #f3f4f6;
      cursor: pointer;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .tab-btn.active {
      background: #667eea;
      color: white;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .form-section h2 {
      margin-bottom: 20px;
      color: #333;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .goals-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    .goals-table thead {
      background: #f3f4f6;
    }

    .goals-table th {
      padding: 12px;
      text-align: left;
      font-weight: 600;
      color: #333;
      border-bottom: 2px solid #e5e7eb;
    }

    .goals-table td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .goals-table tr:hover {
      background: #f9fafb;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-edit {
      background: #3b82f6;
      color: white;
    }

    .btn-edit:hover {
      background: #2563eb;
    }

    .btn-delete {
      background: #dc2626;
      color: white;
    }

    .btn-delete:hover {
      background: #b91c1c;
    }

    .success {
      background: #d1fae5;
      color: #065f46;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .level-badge {
      display: inline-block;
      padding: 4px 12px;
      background: #667eea;
      color: white;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .select-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    select {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }

    input[type="number"], input[type="text"] {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      width: 100%;
    }
  </style>
</head>
<body>

<!-- Login -->
<div id="loginContainer" class="login-container">
  <div class="login-box">
    <h1>🔐 Painel Admin</h1>
    <form id="loginForm">
      <div class="form-group">
        <label>Senha de Administrador</label>
        <input type="password" id="adminPassword" required>
      </div>
      <button type="submit" class="btn">Entrar</button>
      <div id="loginError" class="error"></div>
    </form>
  </div>
</div>

<!-- Admin Panel -->
<div id="adminContainer" class="admin-container">
  <div class="admin-header">
    <h1>📊 Painel de Metas</h1>
    <button class="btn-logout" onclick="logout()">Sair</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('create')">➕ Criar Meta</button>
    <button class="tab-btn" onclick="switchTab('list')">📋 Listar Metas</button>
    <button class="tab-btn" onclick="switchTab('settings')">⚙️ Configurações</button>
  </div>

  <!-- Tab: Criar Meta -->
  <div id="create" class="tab-content active">
    <div class="form-section">
      <h2>Criar Nova Meta</h2>
      <div id="successMessage"></div>

      <div class="form-grid">
        <div>
          <label>Tipo de Meta</label>
          <select id="goalType" onchange="updateGoalForm()">
            <option value="individual">Individual (Por Filial)</option>
            <option value="regional">Regional</option>
            <option value="diretoria">Diretoria</option>
          </select>
        </div>

        <div>
          <label id="scopeLabel">Filial</label>
          <input type="text" id="scope" placeholder="Ex: São Paulo, Salvador, etc">
        </div>

        <div>
          <label>Período</label>
          <select id="period">
            <option value="mensal">Mensal</option>
            <option value="trimestral">Trimestral</option>
            <option value="semestral">Semestral</option>
            <option value="anual">Anual</option>
          </select>
        </div>

        <div>
          <label>Meta (Valor em R$)</label>
          <input type="number" id="targetValue" min="0" step="1000" placeholder="100000">
        </div>

        <div>
          <label>Descrição</label>
          <input type="text" id="description" placeholder="Ex: Vendas de contratos">
        </div>

        <div>
          <label>Data de Início</label>
          <input type="date" id="startDate">
        </div>

        <div>
          <label>Data de Término</label>
          <input type="date" id="endDate">
        </div>

        <div>
          <label>Pontos por Atingimento (%)</label>
          <input type="number" id="pointsPerAchievement" min="0" value="100" placeholder="100">
        </div>
      </div>

      <button class="btn" onclick="createGoal()">💾 Salvar Meta</button>
    </div>
  </div>

  <!-- Tab: Listar Metas -->
  <div id="list" class="tab-content">
    <div class="form-section">
      <h2>Metas Cadastradas</h2>

      <div style="margin-bottom: 20px;">
        <input type="text" id="searchGoals" placeholder="🔍 Procurar metas..." style="width: 300px;">
        <select id="filterType" onchange="loadGoals()" style="margin-left: 10px;">
          <option value="">Todos os tipos</option>
          <option value="individual">Individual</option>
          <option value="regional">Regional</option>
          <option value="diretoria">Diretoria</option>
        </select>
      </div>

      <table class="goals-table">
        <thead>
          <tr>
            <th>Tipo</th>
            <th>Escopo</th>
            <th>Meta (R$)</th>
            <th>Período</th>
            <th>Descrição</th>
            <th>Data Início</th>
            <th>Data Fim</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="goalsTableBody">
          <tr>
            <td colspan="9" style="text-align: center; color: #999;">Carregando metas...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Tab: Configurações -->
  <div id="settings" class="tab-content">
    <div class="form-section">
      <h2>Configurações</h2>

      <div style="margin-bottom: 20px;">
        <h3>Senha de Administrador</h3>
        <p style="color: #666; margin: 10px 0;">Altere a senha para acessar o painel admin</p>
        <input type="password" id="newPassword" placeholder="Nova senha" style="max-width: 300px;">
        <button class="btn" onclick="changePassword()" style="max-width: 300px; margin-top: 10px;">🔐 Alterar Senha</button>
      </div>

      <hr style="margin: 30px 0; border: none; border-top: 1px solid #e5e7eb;">

      <div>
        <h3>Ações</h3>
        <button class="btn-logout" onclick="exportGoals()" style="width: auto; background: #10b981;">📥 Exportar Metas (JSON)</button>
        <button class="btn-logout" onclick="clearAllGoals()" style="width: auto; background: #dc2626; margin-left: 10px;">🗑️ Limpar Todas Metas</button>
      </div>
    </div>
  </div>

</div>

<script>
const ADMIN_PASSWORD = 'admin123'; // Senha padrão
const STORAGE_KEY = 'dashboard_goals';
const PASSWORD_KEY = 'dashboard_admin_password';

// Inicializar
document.addEventListener('DOMContentLoaded', () => {
  const savedPassword = localStorage.getItem(PASSWORD_KEY) || ADMIN_PASSWORD;
  localStorage.setItem(PASSWORD_KEY, savedPassword);
  
  document.getElementById('loginForm').addEventListener('submit', handleLogin);
  
  if (isAuthenticated()) {
    showAdminPanel();
    loadGoals();
  }
});

function handleLogin(e) {
  e.preventDefault();
  const password = document.getElementById('adminPassword').value;
  const savedPassword = localStorage.getItem(PASSWORD_KEY);
  
  if (password === savedPassword) {
    localStorage.setItem('adminAuthenticated', 'true');
    document.getElementById('adminPassword').value = '';
    showAdminPanel();
    loadGoals();
  } else {
    document.getElementById('loginError').textContent = '❌ Senha incorreta';
  }
}

function isAuthenticated() {
  return localStorage.getItem('adminAuthenticated') === 'true';
}

function logout() {
  localStorage.removeItem('adminAuthenticated');
  document.getElementById('adminContainer').classList.remove('active');
  document.getElementById('loginContainer').style.display = 'flex';
  document.getElementById('adminPassword').value = '';
}

function showAdminPanel() {
  document.getElementById('loginContainer').style.display = 'none';
  document.getElementById('adminContainer').classList.add('active');
}

function switchTab(tabName) {
  // Esconder todos os tabs
  document.querySelectorAll('.tab-content').forEach(tab => {
    tab.classList.remove('active');
  });
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.remove('active');
  });

  // Mostrar tab selecionado
  document.getElementById(tabName).classList.add('active');
  event.target.classList.add('active');
}

function updateGoalForm() {
  const type = document.getElementById('goalType').value;
  const label = document.getElementById('scopeLabel');

  if (type === 'individual') {
    label.textContent = 'Filial';
    document.getElementById('scope').placeholder = 'Ex: São Paulo, Salvador';
  } else if (type === 'regional') {
    label.textContent = 'Região';
    document.getElementById('scope').placeholder = 'Ex: Nordeste, Sudeste';
  } else {
    label.textContent = 'Diretoria';
    document.getElementById('scope').placeholder = 'Ex: Vendas, Operações';
  }
}

function createGoal() {
  const goal = {
    id: Date.now(),
    type: document.getElementById('goalType').value,
    scope: document.getElementById('scope').value,
    period: document.getElementById('period').value,
    targetValue: parseFloat(document.getElementById('targetValue').value),
    description: document.getElementById('description').value,
    startDate: document.getElementById('startDate').value,
    endDate: document.getElementById('endDate').value,
    pointsPerAchievement: parseInt(document.getElementById('pointsPerAchievement').value),
    createdAt: new Date().toISOString(),
    currentValue: 0
  };

  if (!goal.scope || !goal.targetValue) {
    alert('⚠️ Preencha todos os campos obrigatórios!');
    return;
  }

  const goals = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  goals.push(goal);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(goals));

  // Mostrar mensagem de sucesso
  const successDiv = document.getElementById('successMessage');
  successDiv.innerHTML = `✅ Meta "${goal.description}" criada com sucesso!`;
  successDiv.style.display = 'block';
  setTimeout(() => {
    successDiv.style.display = 'none';
  }, 3000);

  // Limpar formulário
  document.getElementById('goalType').value = 'individual';
  document.getElementById('scope').value = '';
  document.getElementById('targetValue').value = '';
  document.getElementById('description').value = '';
  document.getElementById('startDate').value = '';
  document.getElementById('endDate').value = '';
  document.getElementById('pointsPerAchievement').value = '100';

  loadGoals();
}

function loadGoals() {
  const goals = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  const filterType = document.getElementById('filterType')?.value || '';
  const search = document.getElementById('searchGoals')?.value.toLowerCase() || '';

  let filtered = goals;
  
  if (filterType) {
    filtered = filtered.filter(g => g.type === filterType);
  }

  if (search) {
    filtered = filtered.filter(g => 
      g.scope.toLowerCase().includes(search) ||
      g.description.toLowerCase().includes(search)
    );
  }

  const tbody = document.getElementById('goalsTableBody');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; color: #999;">Nenhuma meta cadastrada</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(goal => `
    <tr>
      <td><span class="level-badge">${goal.type}</span></td>
      <td><strong>${goal.scope}</strong></td>
      <td>R$ ${goal.targetValue.toLocaleString('pt-BR')}</td>
      <td>${goal.period}</td>
      <td>${goal.description}</td>
      <td>${new Date(goal.startDate).toLocaleDateString('pt-BR')}</td>
      <td>${new Date(goal.endDate).toLocaleDateString('pt-BR')}</td>
      <td>
        <span style="color: #10b981; font-weight: 600;">Ativa</span>
      </td>
      <td>
        <button class="btn-small btn-edit" onclick="editGoal(${goal.id})">✏️ Editar</button>
        <button class="btn-small btn-delete" onclick="deleteGoal(${goal.id})">🗑️ Deletar</button>
      </td>
    </tr>
  `).join('');
}

function deleteGoal(id) {
  if (!confirm('Tem certeza que deseja deletar esta meta?')) return;

  let goals = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  goals = goals.filter(g => g.id !== id);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(goals));
  loadGoals();
}

function editGoal(id) {
  const goals = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  const goal = goals.find(g => g.id === id);
  
  if (!goal) return;

  // Preencher formulário
  document.getElementById('goalType').value = goal.type;
  document.getElementById('scope').value = goal.scope;
  document.getElementById('period').value = goal.period;
  document.getElementById('targetValue').value = goal.targetValue;
  document.getElementById('description').value = goal.description;
  document.getElementById('startDate').value = goal.startDate;
  document.getElementById('endDate').value = goal.endDate;
  document.getElementById('pointsPerAchievement').value = goal.pointsPerAchievement;

  updateGoalForm();

  // Deletar meta antiga e ir para aba de criação
  deleteGoal(id);
  switchTab('create');
  document.querySelector('[onclick="switchTab(\'create\')"]').click();
}

function changePassword() {
  const newPassword = document.getElementById('newPassword').value;
  
  if (!newPassword || newPassword.length < 4) {
    alert('⚠️ Senha deve ter no mínimo 4 caracteres');
    return;
  }

  localStorage.setItem(PASSWORD_KEY, newPassword);
  document.getElementById('newPassword').value = '';
  alert('✅ Senha alterada com sucesso!');
}

function exportGoals() {
  const goals = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  const dataStr = JSON.stringify(goals, null, 2);
  const dataBlob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(dataBlob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `metas-${new Date().toISOString().split('T')[0]}.json`;
  link.click();
}

function clearAllGoals() {
  if (!confirm('⚠️ Tem CERTEZA que deseja deletar TODAS as metas? Isso não pode ser desfeito!')) return;
  localStorage.removeItem(STORAGE_KEY);
  loadGoals();
  alert('✅ Todas as metas foram deletadas');
}

// Atualizar lista ao pesquisar
document.addEventListener('keyup', (e) => {
  if (e.target.id === 'searchGoals') {
    loadGoals();
  }
});
</script>

</body>
</html>
